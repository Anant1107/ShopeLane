<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jute Bags</title>
    <link rel="stylesheet" href="css/ProductDescription.css">
</head>

<body>
    <div id="1"></div>
    <script>
        load("header.html");
        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(1).innerHTML = req.responseText;
        }
    </script>
    <div class="space"></div>
    <div class="maincontainer">
        <div class="DescImage">
            <img class="ProductImg" src="img/jute pack.jpg" alt="">
        </div>
        <div class="Description">
            <p class="ProdDisc">
                Made from a natural, strong, and durable fiber that can be used to carry heavy items. Jute bags are also biodegradable and reusable, making them a good alternative to plastic bags. 
            </p>
            <p class="ProdPrice">
                ₹870/-
            </p>
            <p class="count">
                per 10pcs
                <br>
                *free delivery on bulk orders.
            </p>
            <p class="ProdQuant">
                <label for="quantity">Quantity:</label>
                <select id="quantity" name="quantity">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="5">6</option>
                    <option value="5">7</option>
                    <option value="5">8</option>
                    <option value="5">9</option>
                    <option value="5">10</option>
                </select>
            </p>
            <button class="buy">
                <a class="Linkcolor" href="BuyCompleted.html">buy now</a>
            </button>
            <button class="cart">
                add to cart
            </button>
        </div>
    </div>


    <div id="4"></div>
    <script>
        load("footer.html");
        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(4).innerHTML = req.responseText;
        }
    </script>
</body>

</html>
