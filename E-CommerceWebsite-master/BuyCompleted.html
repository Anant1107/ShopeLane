<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed</title>
    <link rel="stylesheet" href="css/BuyCompleted.css">
</head>

<body>
    <div id="1"></div>
    <script>
        load("header.html");
        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(1).innerHTML = req.responseText;
        }
    </script>
    <div class="space"></div>
    <div class="main">

        <div class="Congo">
            <h2>CONGRATULATIONS!!&#x1F389;</h2>
        </div>
        <div class="text">
            <h4>Order Placed Successfully!</h4>
        </div>
        <div class="thank">
            <h5>Thank You!</h5>
        </div>
        <div class="Continue">
            <a class="Linkcolor Continue" href="index.html"><u>Continue Shopping</u></a>
        </div>

    </div>
    <div id="4"></div>
    <script>
        load("footer.html");
        function load(url) {
            req = new XMLHttpRequest();
            req.open("GET", url, false);
            req.send(null);
            document.getElementById(4).innerHTML = req.responseText;
        }
    </script>
</body>

</html>
